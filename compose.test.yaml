name: finance-cockpit-test
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: finance_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: local-isolated-test
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -U, test, -d, finance_test]
      interval: 2s
      retries: 20
  redis:
    image: redis:8.2.4-alpine
  test:
    build:
      context: ./server
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:local-isolated-test@postgres:5432/finance_test
      TEST_DATABASE_URL: postgresql://test:local-isolated-test@postgres:5432/finance_test
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: {condition: service_healthy}
    command: [npm, test]
